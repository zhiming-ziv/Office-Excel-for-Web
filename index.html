<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel 编辑工具</title>
  <script>
    // 防主题闪烁：在样式表加载前应用已保存（或系统偏好）的主题
    (function () {
      try {
        var t = localStorage.getItem('excel-tool:theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="4" fill="#217346"/>
          <path d="M6.5 6.5h11v11h-11z" fill="none" stroke="#fff" stroke-width="1.2" opacity=".55"/>
          <path d="M9.5 12l2 2 3.5-4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="brand-text">
          <span class="title">Excel 编辑工具</span>
          <span class="subtitle">本地运行 · 数据不离开浏览器</span>
        </div>
      </div>

      <div class="actions">
        <span id="file-name" class="fname" title="点击可重命名">未命名.xlsx</span>
        <button id="btn-new" class="btn" type="button" title="新建空白工作簿 (Ctrl+N)">新建</button>
        <button id="btn-open" class="btn" type="button" title="打开 xlsx / xls / csv 文件 (Ctrl+O)">打开</button>
        <button id="btn-save" class="btn primary" type="button" title="保存为 xlsx 文件 (Ctrl+S)">保存</button>
        <button id="btn-csv" class="btn" type="button" title="将当前工作表导出为 CSV">导出 CSV</button>
        <button id="btn-theme" class="btn icon-only" type="button" title="切换到深色主题" aria-label="切换浅色 / 深色主题">
          <svg class="icon-theme icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="icon-theme icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <div id="statusbar">
      <span id="status-text">准备中…</span>
      <span id="autosave-state" role="status">正在读取草稿…</span>
      <span class="hint">支持 XLSX / XLSM / CSV；保存为 XLSX，宏、图片、图表及高级功能不保留</span>
    </div>

    <div id="compatibility-notice" role="status" hidden></div>
    <main id="luckysheet"></main>

    <div id="drop-overlay">
      <div class="drop-box">
        <div class="drop-icon">📄</div>
        <div class="drop-text">松开鼠标，打开 Excel / CSV 文件</div>
      </div>
    </div>

    <div id="toast" role="status"></div>
  </div>

  <input type="file" id="file-input" accept=".xlsx,.xlsm,.csv" hidden />

  <!-- Luckysheet 官方插件包：必须在应用模块之前以经典 script 加载，
       它提供 Luckysheet 依赖的全局 jQuery 及 spectrum 取色器等插件 -->
  <script src="./luckysheet-plugin.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
